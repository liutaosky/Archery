{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="col-md-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title">
                        {% if resource_instance %}
                            编辑实例资源关联
                        {% else %}
                            新增实例资源关联
                        {% endif %}
                    </h3>
                </div>
                <div class="panel-body">
                    <form id="resource_instance_form" class="form-horizontal" method="post">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label class="col-sm-2 control-label">数据库实例 <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <select name="instance" class="form-control selectpicker" required>
                                    <option value="">请选择</option>
                                    {% for inst in instance_list %}
                                        <option value="{{ inst.id }}" {% if resource_instance and resource_instance.instance.id == inst.id %}selected{% endif %}>
                                            {{ inst.instance_name }} ({{ inst.get_db_type_display }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">所属机房</label>
                            <div class="col-sm-8">
                                <select name="idc" class="form-control selectpicker">
                                    <option value="">请选择</option>
                                    {% for idc in idc_list %}
                                        <option value="{{ idc.idc_id }}" {% if resource_instance and resource_instance.idc.idc_id == idc.idc_id %}selected{% endif %}>
                                            {{ idc.idc_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">所属服务器</label>
                            <div class="col-sm-8">
                                <select name="server" class="form-control selectpicker">
                                    <option value="">请选择</option>
                                    {% for server in server_list %}
                                        <option value="{{ server.server_id }}" {% if resource_instance and resource_instance.server.server_id == server.server_id %}selected{% endif %}>
                                            {{ server.server_name }} ({{ server.server_ip }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">所属项目</label>
                            <div class="col-sm-8">
                                <select name="project" class="form-control selectpicker">
                                    <option value="">请选择</option>
                                    {% for project in project_list %}
                                        <option value="{{ project.project_id }}" {% if resource_instance and resource_instance.project.project_id == project.project_id %}selected{% endif %}>
                                            {{ project.project_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">所属集群</label>
                            <div class="col-sm-8">
                                <select name="cluster" class="form-control selectpicker">
                                    <option value="">请选择</option>
                                    {% for cluster in cluster_list %}
                                        <option value="{{ cluster.cluster_id }}" {% if resource_instance and resource_instance.cluster.cluster_id == cluster.cluster_id %}selected{% endif %}>
                                            {{ cluster.cluster_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">环境类型</label>
                            <div class="col-sm-8">
                                <select name="instance_env" class="form-control selectpicker">
                                    <option value="production" {% if resource_instance and resource_instance.instance_env == 'production' %}selected{% endif %}>生产</option>
                                    <option value="test" {% if resource_instance and resource_instance.instance_env == 'test' %}selected{% endif %}>测试</option>
                                    <option value="dev" {% if resource_instance and resource_instance.instance_env == 'dev' %}selected{% endif %}>开发</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">重要级别</label>
                            <div class="col-sm-8">
                                <select name="instance_level" class="form-control selectpicker">
                                    <option value="1" {% if resource_instance and resource_instance.instance_level == 1 %}selected{% endif %}>核心</option>
                                    <option value="2" {% if not resource_instance or resource_instance.instance_level == 2 %}selected{% endif %}>重要</option>
                                    <option value="3" {% if resource_instance and resource_instance.instance_level == 3 %}selected{% endif %}>一般</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">备注</label>
                            <div class="col-sm-8">
                                <textarea name="instance_remark" class="form-control" rows="3">{{ resource_instance.instance_remark|default:'' }}</textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-8">
                                <button type="submit" class="btn btn-primary">
                                    <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> 保存
                                </button>
                                <button type="button" class="btn btn-default" onclick="window.location.href='/resource/instance/'">
                                    <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> 取消
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
